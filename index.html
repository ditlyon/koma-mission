const { useState, useEffect } = React;

/* ================= inline icon components (replaces lucide-react so this file needs no build step) ================= */
function Icon({ size = 18, color = "currentColor", children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>

}
const Plus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14" /></Icon>;
const ChevronLeft = (p) => <Icon {...p}><path d="M15 18l-6-6 6-6" /></Icon>;
const ChevronDown = (p) => <Icon {...p}><path d="M6 9l6 6 6-6" /></Icon>;
const ChevronUp = (p) => <Icon {...p}><path d="M6 15l6-6 6 6" /></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6L9 17l-5-5" /></Icon>;
const AlertTriangle = (p) => <Icon {...p}><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /><path d="M12 9v4" /><path d="M12 17h.01" /></Icon>;
const Sparkles = (p) => <Icon {...p}><path d="M12 3l1.7 4.9L18.5 9l-4.8 1.7L12 15.5l-1.7-4.8L5.5 9l4.8-2.1Z" /></Icon>;
const X = (p) => <Icon {...p}><path d="M18 6L6 18" /><path d="M6 6l12 12" /></Icon>;
const RotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 3v6h6" /></Icon>;

const FONT_DISPLAY = "'Mochiy Pop One', sans-serif";
const FONT_BODY = "'M PLUS Rounded 1c', sans-serif";

const FontLoader = () => (
  <style>{`
    @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');
    * { font-family: ${FONT_BODY}; }
    .font-display { font-family: ${FONT_DISPLAY}; }
    @keyframes popIn { 0% { transform: scale(0) rotate(-15deg); opacity:0; } 60% { transform: scale(1.15) rotate(6deg); opacity:1; } 100% { transform: scale(1) rotate(-8deg); opacity:1; } }
    @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity:1; } 100% { transform: translateY(70px) rotate(360deg); opacity:0; } }
    .stamp-pop { animation: popIn 0.35s cubic-bezier(.2,1.5,.4,1) forwards; }
    .confetti-piece { animation: confettiFall 0.9s ease-out forwards; }
  `}</style>
);

const inputStyle = { border: `2px solid ${C.ink}`, background: "#fff", fontFamily: FONT_BODY };

/* ================= safe storage wrapper (localStorage, for standalone/GitHub Pages use) ================= */
const safeStorage = {
  async get(key) {
    try {
      const v = window.localStorage.getItem(key);
      if (v === null) return null;
      return { key, value: v };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

/* ================= helpers ================= */
const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

// koma.stage: 0=ラフ未 1=ラフ済/線画未 2=線画済/仕上げ未 3=仕上げ済
const STAGE_LABELS = ["①アタリ", "②ラフ", "③下書き+線画", "④仕上げ"];
const STAGE_SHORT = ["アタリ", "ラフ", "下書き+線画", "仕上げ"];
const ATARI_HOURS = 0.25;

function newKoma() {
  return { id: uid(), size: "normal", stage: 0 };
}
function newGroup(count) {
  return { id: uid(), atariDone: false, komas: Array.from({ length: count }, newKoma) };
}
function newBookSkeleton({ title, totalPages, startDate, deadline, dailyHours, avgKoma, coverKoma }) {
  const interiorCount = Math.max(0, totalPages - 2);
  return {
    id: uid(),
    title,
    totalPages,
    startDate,
    deadline,
    dailyHours,
    bufferDays: 2,
    avgKoma,
    cover: newGroup(coverKoma),
    pages: Array.from({ length: interiorCount }, () => newGroup(avgKoma)),
    missionState: null,
  };
}

/** unified list: cover + interior pages, each { id, label, komas, atariDone } */
function groups(book) {
  const list = [];
  if (book.cover) list.push({ id: "cover", label: "表紙", komas: book.cover.komas, atariDone: book.cover.atariDone });
  book.pages.forEach((p, i) => list.push({ id: p.id, label: `P${i + 1}`, komas: p.komas, atariDone: p.atariDone }));
  return list;
}

/** rough/senga/shiage are true per-koma hours (not divided across the page) */
function komaHours(koma) {
  if (koma.size === "oogoma") return { rough: 7.5, senga: 7.5, shiage: 1.5 };
  return { rough: 3, senga: 3, shiage: 1 };
}

function isGroupUnlocked(group) {
  if (group.komas.length === 0) return true;
  return group.komas.every((k) => k.stage >= 2);
}

function computeStats(book) {
  const gs = groups(book);
  let totalSengaHours = 0,
    completedSengaHours = 0,
    totalShiageHours = 0,
    completedShiageHours = 0;

  gs.forEach((g) => {
    if (g.komas.length === 0) return; // blank page: contributes nothing
    totalSengaHours += ATARI_HOURS;
    if (g.atariDone) completedSengaHours += ATARI_HOURS;
    g.komas.forEach((k) => {
      const h = komaHours(k);
      totalSengaHours += h.rough + h.senga;
      totalShiageHours += h.shiage;
      if (k.stage >= 1) completedSengaHours += h.rough;
      if (k.stage >= 2) completedSengaHours += h.senga;
      if (k.stage >= 3) completedShiageHours += h.shiage;
    });
  });

  const actualSenga = totalSengaHours > 0 ? (completedSengaHours / totalSengaHours) * 100 : 100;
  const actualShiage = totalShiageHours > 0 ? (completedShiageHours / totalShiageHours) * 100 : 100;

  const dailyHours = book.dailyHours || 3;
  const bufferDays = book.bufferDays ?? 2;
  const start = book.startDate;
  const deadline = book.deadline;
  const totalDays = Math.max(1, daysBetween(start, deadline));

  const shiageDays = Math.ceil(totalShiageHours / dailyHours);
  let sengaTargetDate = new Date(deadline);
  sengaTargetDate.setDate(sengaTargetDate.getDate() - shiageDays - bufferDays);
  sengaTargetDate = sengaTargetDate.toISOString().slice(0, 10);

  const daysToSengaTarget = Math.max(1, daysBetween(start, sengaTargetDate));
  const elapsed = Math.max(0, daysBetween(start, todayStr()));

  const requiredSenga = clamp((elapsed / daysToSengaTarget) * 100, 0, 100);
  const requiredShiage = clamp((elapsed / totalDays) * 100, 0, 100);

  const dangerOf = (actual, required) => {
    if (actual >= required) return "green";
    if (required - actual <= 15) return "yellow";
    return "red";
  };
  const sengaDanger = dangerOf(actualSenga, requiredSenga);
  const shiageDanger = dangerOf(actualShiage, requiredShiage);
  const overallDanger =
    sengaDanger === "red" || shiageDanger === "red" ? "red" : sengaDanger === "yellow" || shiageDanger === "yellow" ? "yellow" : "green";

  let suggestion = null;
  if (sengaDanger !== "green") {
    const shortfallHours = ((requiredSenga - actualSenga) / 100) * totalSengaHours;
    const daysBehind = Math.max(1, Math.ceil(shortfallHours / dailyHours));
    suggestion = `線画ラインが必達ペースより約${Math.max(0.5, shortfallHours).toFixed(1)}h(約${daysBehind}日分)遅れています。大ゴマの格下げ、またはページ数の削減を検討してください。`;
  } else if (shiageDanger !== "green") {
    suggestion = `仕上げが必達ペースより遅れています。線画が終わっているページから優先して仕上げに着手してください。`;
  }

  return {
    actualSenga,
    actualShiage,
    requiredSenga,
    requiredShiage,
    sengaDanger,
    shiageDanger,
    overallDanger,
    suggestion,
    sengaTargetDate,
    totalSengaHours,
    totalShiageHours,
  };
}

function getNextTask(koma, unlocked) {
  const h = komaHours(koma);
  if (koma.stage === 0) return { key: "rough", label: STAGE_LABELS[1], hours: h.rough };
  if (koma.stage === 1) return { key: "senga", label: STAGE_LABELS[2], hours: h.senga };
  if (koma.stage === 2 && unlocked) return { key: "shiage", label: STAGE_LABELS[3], hours: h.shiage };
  return null;
}

/** builds the ordered, flat list of actionable rows across the whole book */
function buildRows(book) {
  const gs = groups(book);
  const rows = [];
  gs.forEach((g) => {
    if (g.komas.length === 0) return; // blank page, no tasks
    if (!g.atariDone) {
      rows.push({ type: "atari", groupId: g.id, label: g.label });
      return;
    }
    const unlocked = isGroupUnlocked(g);
    g.komas.forEach((k) => {
      const task = getNextTask(k, unlocked);
      if (task) rows.push({ type: "koma", groupId: g.id, label: g.label, koma: k, task });
    });
  });
  return rows;
}

const rowKey = (row) => (row.type === "atari" ? `atari-${row.groupId}` : `koma-${row.koma.id}`);
const rowHours = (row) => (row.type === "atari" ? ATARI_HOURS : row.task.hours);
const rowTitle = (row) => (row.type === "atari" ? STAGE_LABELS[0] : row.task.label);

/** greedily fills "today's mission" up to dailyHours, always including at least one task */
function buildMission(rows, dailyHours, dateKey) {
  const items = [];
  let cum = 0;
  const budget = dailyHours || 3;
  for (const row of rows) {
    const hours = rowHours(row);
    if (items.length > 0 && cum + hours > budget) break;
    items.push({ key: rowKey(row), hours, label: row.label, title: rowTitle(row) });
    cum += hours;
  }
  return { date: dateKey, items, doneKeys: [] };
}

/* ================= small UI atoms ================= */
function DangerDot({ level }) {
  const color = level === "red" ? C.red : level === "yellow" ? C.amber : C.mint;
  return <span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 999, background: color, border: `1.5px solid ${C.ink}` }} />;
}

function PanelButton({ children, onClick, style, rotate = 0 }) {
  return (
    <button
      onClick={onClick}
      className="px-4 py-2 font-bold"
      style={{
        fontFamily: FONT_DISPLAY,
        background: C.paper,
        border: `2.5px solid ${C.ink}`,
        borderRadius: 10,
        boxShadow: `3px 3px 0 ${C.ink}`,
        transform: `rotate(${rotate}deg)`,
        ...style,
      }}
    >
      {children}
    </button>
  );
}

function Bar({ actual, required, color }) {
  return (
    <div style={{ position: "relative", height: 22, background: "#fff", border: `2px solid ${C.ink}`, borderRadius: 6, overflow: "hidden" }}>
      <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${actual}%`, background: color, transition: "width 0.4s" }} />
      <div style={{ position: "absolute", left: `${required}%`, top: -3, bottom: -3, width: 3, background: C.ink }} title="必達ライン" />
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div>
      <label style={{ color: C.inkSoft, fontSize: 13, fontWeight: 700 }}>{label}</label>
      <div className="mt-1">{children}</div>
    </div>
  );
}

function CompletionBurst() {
  const colors = [C.pink, C.mint, C.amber, C.red];
  return (
    <div style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      <div
        className="stamp-pop"
        style={{
          position: "absolute", top: "50%", left: "50%", marginTop: -28, marginLeft: -28,
          width: 56, height: 56, borderRadius: 999, border: `3px solid ${C.red}`, color: C.red,
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: FONT_DISPLAY, fontSize: 16, background: "rgba(255,255,255,0.85)", zIndex: 5,
        }}
      >
        済
      </div>
      {Array.from({ length: 10 }).map((_, i) => (
        <div key={i} className="confetti-piece" style={{ position: "absolute", top: "40%", left: `${10 + i * 8}%`, width: 6, height: 6, background: colors[i % colors.length], animationDelay: `${i * 0.03}s` }} />
      ))}
    </div>
  );
}

/* ================= Group (page/cover) editor row — shared by create + edit ================= */
function GroupEditRow({ label, group, onSetCount, onToggleOogoma, onDelete, deletable }) {
  const [editing, setEditing] = useState(false);
  const [expand, setExpand] = useState(false);
  const hasOogoma = group.komas.some((k) => k.size === "oogoma");
  const hasProgress = group.komas.some((k) => k.stage > 0) || group.atariDone;
  return (
    <div className="p-2 rounded-lg" style={{ border: `2px solid ${C.ink}`, background: "#fff" }}>
      <div className="flex items-center justify-between gap-2">
        <button onClick={() => setExpand((v) => !v)} className="flex items-center gap-2 flex-1 text-left">
          <span style={{ fontWeight: 800 }}>{label}</span>
          <span style={{ color: C.inkSoft, fontSize: 13 }}>{group.komas.length}コマ</span>
          {hasOogoma && <span style={{ fontSize: 11, color: C.pinkDeep }}>大ゴマあり</span>}
        </button>
        {editing ? (
          <input
            type="number" min={0} autoFocus defaultValue={group.komas.length} onFocus={(e) => e.target.select()}
            onBlur={(e) => { onSetCount(Math.max(0, Number(e.target.value))); setEditing(false); }}
            className="w-16 p-1 rounded" style={{ border: `2px solid ${C.ink}` }}
          />
        ) : (
          <button onClick={() => setEditing(true)}><Pencil size={16} color={C.inkSoft} /></button>
        )}
        {deletable && (
          <button onClick={() => { if (!hasProgress || window.confirm(`${label}は作業途中です。本当に削除しますか？`)) onDelete(); }}>
            <Trash2 size={15} color={C.inkSoft} />
          </button>
        )}
      </div>
      {expand && (
        <div className="flex flex-wrap gap-1.5 mt-2">
          {group.komas.length === 0 && <span style={{ fontSize: 12, color: C.inkSoft }}>0コマ(白紙扱い・タスクなし)</span>}
          {group.komas.map((k, i) => (
            <button
              key={k.id} onClick={() => onToggleOogoma(k.id)} className="px-2 py-1 rounded"
              style={{ fontSize: 12, border: `1.5px solid ${C.ink}`, background: k.size === "oogoma" ? C.pink : C.paperDeep, color: k.size === "oogoma" ? "#fff" : C.ink }}
            >
              コマ{i + 1}{k.size === "oogoma" ? " 大" : ""}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/** shared editor for cover + interior page list, with add/remove */
function GroupListEditor({ cover, pages, onChangeCover, onChangePages, avgKoma }) {
  const setCoverCount = (n) => {
    const komas = [...cover.komas];
    while (komas.length < n) komas.push(newKoma());
    while (komas.length > n) komas.pop();
    onChangeCover({ ...cover, komas });
  };
  const toggleCoverOogoma = (kid) => {
    onChangeCover({ ...cover, komas: cover.komas.map((k) => (k.id === kid ? { ...k, size: k.size === "oogoma" ? "normal" : "oogoma" } : k)) });
  };
  const setPageCount = (pid, n) => {
    onChangePages(pages.map((p) => {
      if (p.id !== pid) return p;
      const komas = [...p.komas];
      while (komas.length < n) komas.push(newKoma());
      while (komas.length > n) komas.pop();
      return { ...p, komas };
    }));
  };
  const togglePageOogoma = (pid, kid) => {
    onChangePages(pages.map((p) => (p.id !== pid ? p : { ...p, komas: p.komas.map((k) => (k.id === kid ? { ...k, size: k.size === "oogoma" ? "normal" : "oogoma" } : k)) })));
  };
  const deletePage = (pid) => onChangePages(pages.filter((p) => p.id !== pid));
  const addPage = () => onChangePages([...pages, newGroup(avgKoma ?? 5)]);

  return (
    <div className="space-y-2">
      <GroupEditRow label="表紙(P1+裏表紙)" group={cover} onSetCount={setCoverCount} onToggleOogoma={toggleCoverOogoma} deletable={false} />
      {pages.map((p, i) => (
        <GroupEditRow key={p.id} label={`P${i + 1}`} group={p} onSetCount={(n) => setPageCount(p.id, n)} onToggleOogoma={(kid) => togglePageOogoma(p.id, kid)} onDelete={() => deletePage(p.id)} deletable />
      ))}
      <PanelButton onClick={addPage} style={{ background: "#fff", color: C.ink, width: "100%" }}>
        <span className="flex items-center justify-center gap-1"><Plus size={16} /> ページを追加</span>
      </PanelButton>
    </div>
  );
}

/* ================= Registration Wizard ================= */
function RegisterWizard({ onCancel, onSave }) {
  const [step, setStep] = useState(1);
  const [title, setTitle] = useState("");
  const [totalPages, setTotalPages] = useState(20);
  const [startDate, setStartDate] = useState(todayStr());
  const [deadline, setDeadline] = useState("");
  const [dailyHours, setDailyHours] = useState(3);
  const [avgKoma, setAvgKoma] = useState(5);
  const [book, setBook] = useState(null);
  const [error, setError] = useState("");

  const goStep2 = () => {
    if (!title.trim()) return setError("タイトルを入力してください");
    if (!totalPages || totalPages < 1) return setError("総ページ数を入力してください");
    if (!startDate) return setError("着手開始日を入力してください");
    if (!deadline) return setError("締切日を入力してください");
    setError("");
    setStep(2);
  };

  const genPages = () => {
    setBook(newBookSkeleton({ title, totalPages, startDate, deadline, dailyHours, avgKoma, coverKoma: 1 }));
    setError("");
    setStep(3);
  };

  const trySave = () => {
    if (!book) return setError("先にページ構成を作成してください");
    onSave(book);
  };

  return (
    <div className="min-h-full p-4" style={{ background: C.paper }}>
      <div className="flex items-center gap-2 mb-4">
        <button onClick={onCancel}><ChevronLeft color={C.ink} /></button>
        <h2 className="font-display text-lg" style={{ color: C.ink }}>本を登録 ({step}/3)</h2>
      </div>

      {step === 1 && (
        <div className="space-y-4">
          <Field label="タイトル"><input value={title} onChange={(e) => setTitle(e.target.value)} className="w-full p-2 rounded-lg" style={inputStyle} placeholder="メユノマニマニ" /></Field>
          <Field label="総ページ数(表紙+裏表紙を含む)"><input type="number" value={totalPages} onFocus={(e) => e.target.select()} onChange={(e) => setTotalPages(Number(e.target.value))} className="w-full p-2 rounded-lg" style={inputStyle} /></Field>
          <Field label="着手開始日"><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full p-2 rounded-lg" style={inputStyle} /></Field>
          <Field label="締切日"><input type="date" value={deadline} onChange={(e) => setDeadline(e.target.value)} className="w-full p-2 rounded-lg" style={inputStyle} /></Field>
          <Field label="1日に使える作業時間の目安(h)"><input type="number" value={dailyHours} onFocus={(e) => e.target.select()} onChange={(e) => setDailyHours(Number(e.target.value))} className="w-full p-2 rounded-lg" style={inputStyle} /></Field>
          {error && <div style={{ color: C.red, fontSize: 13, fontWeight: 700 }}>⚠ {error}</div>}
          <PanelButton onClick={goStep2} style={{ background: C.pink, color: "#fff", width: "100%" }}>次へ →</PanelButton>
        </div>
      )}

      {step === 2 && (
        <div className="space-y-4">
          <p style={{ color: C.inkSoft, fontSize: 14 }}>本文ページに同じコマ数を割り当てます(表紙は別枠、あとで個別ページも0含め修正可)。</p>
          <Field label="1ページあたりの平均コマ数"><input type="number" min={0} value={avgKoma} onFocus={(e) => e.target.select()} onChange={(e) => setAvgKoma(Number(e.target.value))} className="w-full p-2 rounded-lg" style={inputStyle} /></Field>
          <PanelButton onClick={genPages} style={{ background: C.pink, color: "#fff", width: "100%" }}>この数で本文ページを作成</PanelButton>
        </div>
      )}

      {step === 3 && book && (
        <div className="space-y-3">
          <p style={{ color: C.inkSoft, fontSize: 14 }}>表紙・平均と違うページだけ✏️で修正。コマをタップで大ゴマ切替。0コマも可(白紙ページ用)。</p>
          <div className="max-h-[55vh] overflow-y-auto pr-1">
            <GroupListEditor
              cover={book.cover}
              pages={book.pages}
              avgKoma={avgKoma}
              onChangeCover={(cover) => setBook({ ...book, cover })}
              onChangePages={(pages) => setBook({ ...book, pages })}
            />
          </div>
          {error && <div style={{ color: C.red, fontSize: 13, fontWeight: 700 }}>⚠ {error}</div>}
          <PanelButton onClick={trySave} style={{ background: C.mint, color: "#fff", width: "100%" }}>登録する</PanelButton>
        </div>
      )}
    </div>
  );
}

/* ================= Task row card (shared by mission + later list) ================= */
function TaskRowCard({ row, onComplete, onResetKoma, burstActive, faded }) {
  const oogoma = row.type === "koma" && row.koma.size === "oogoma";
  const title = rowTitle(row);
  const hours = rowHours(row);
  const sub =
    row.type === "atari"
      ? `${row.label} ・ページ全体 ・目安 ${Math.round(ATARI_HOURS * 60)}分`
      : `${row.label} コマ ・目安 ${hours < 1 ? Math.round(hours * 60) + "分" : hours.toFixed(1) + "h"}`;

  // each tap steps back exactly one stage; disabled once already at stage 0
  const canReset = row.type === "koma" && row.koma.stage > 0;

  return (
    <div
      style={{
        position: "relative", border: `3px solid ${C.ink}`, borderRadius: 12,
        background: oogoma ? C.paperDeep : "#fff", boxShadow: `4px 4px 0 ${C.ink}`,
        padding: "12px 14px", display: "flex", alignItems: "center", justifyContent: "space-between",
        opacity: faded ? 0.65 : 1,
      }}
    >
      <div>
        <div style={{ fontFamily: FONT_DISPLAY, fontSize: 14, color: C.ink }}>
          {title} {oogoma && <span style={{ color: C.pinkDeep, fontSize: 11 }}>大ゴマ</span>}
        </div>
        <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 2 }}>{sub}</div>
      </div>
      <div className="flex items-center gap-2 flex-shrink-0">
        {canReset && (
          <button
            onClick={() => onResetKoma(row.koma.stage - 1)}
            title="1工程戻す"
            style={{ width: 32, height: 32, borderRadius: 999, border: `2px solid ${C.inkSoft}`, background: "#fff", display: "flex", alignItems: "center", justifyContent: "center" }}
          >
            <RotateCcw size={15} color={C.inkSoft} />
          </button>
        )}
        <button
          onClick={onComplete}
          style={{ width: 40, height: 40, borderRadius: 999, border: `2.5px solid ${C.ink}`, background: C.mint, display: "flex", alignItems: "center", justifyContent: "center" }}
        >
          <Check color="#fff" size={20} />
        </button>
      </div>
      {burstActive && <CompletionBurst />}
    </div>
  );
}

function RowList({ rows, burstId, faded, onCompleteRow, onResetRow }) {
  let lastLabel = null;
  return (
    <div className="space-y-2">
      {rows.map((row) => {
        const key = rowKey(row);
        const showHeader = row.label !== lastLabel;
        lastLabel = row.label;
        return (
          <React.Fragment key={key}>
            {showHeader && <div style={{ fontFamily: FONT_DISPLAY, color: C.inkSoft, fontSize: 12, marginTop: 4 }}>{row.label}</div>}
            <TaskRowCard
              row={row}
              faded={faded}
              burstActive={burstId === key}
              onComplete={() => onCompleteRow(row)}
              onResetKoma={(targetStage) => onResetRow(row, targetStage)}
            />
          </React.Fragment>
        );
      })}
    </div>
  );
}

/* ================= Today's Task List ================= */
function TodayView({ book, onUpdateBook }) {
  const [burstId, setBurstId] = useState(null);
  const [showLater, setShowLater] = useState(false);

  const todayKey = todayStr();
  const rows = buildRows(book);
  const dailyHours = book.dailyHours || 3;

  const missionNeedsRegen = !book.missionState || book.missionState.date !== todayKey;

  // regenerate today's mission once per day (or on first load)
  useEffect(() => {
    if (missionNeedsRegen) {
      onUpdateBook({ ...book, missionState: buildMission(rows, dailyHours, todayKey) });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [missionNeedsRegen, todayKey]);

  const mission = missionNeedsRegen ? buildMission(rows, dailyHours, todayKey) : book.missionState;
  const plannedKeySet = new Set(mission.items.map((i) => i.key));
  const doneKeySet = new Set(mission.doneKeys || []);

  const missionRows = rows.filter((r) => plannedKeySet.has(rowKey(r)) && !doneKeySet.has(rowKey(r)));
  const laterRows = rows.filter((r) => !plannedKeySet.has(rowKey(r)) || doneKeySet.has(rowKey(r)));
  const laterHours = laterRows.reduce((s, r) => s + rowHours(r), 0);

  const doneItems = mission.items.filter((i) => doneKeySet.has(i.key));
  const doneHours = doneItems.reduce((s, i) => s + i.hours, 0);
  const totalHours = mission.items.reduce((s, i) => s + i.hours, 0);
  const doneCount = doneItems.length;
  const totalCount = mission.items.length;
  const pct = totalHours > 0 ? clamp((doneHours / totalHours) * 100, 0, 100) : 100;

  const burst = (id) => { setBurstId(id); setTimeout(() => setBurstId(null), 850); };

  const markDoneIfPlanned = (key) => {
    if (!plannedKeySet.has(key) || doneKeySet.has(key)) return mission;
    return { ...mission, doneKeys: [...(mission.doneKeys || []), key] };
  };

  const applyUpdate = (updatedBookFields, key, groupId) => {
    const updatedBook = { ...book, ...updatedBookFields };
    let nextMissionState = markDoneIfPlanned(key);

    // If this action unlocked new tasks within the same group (e.g. 仕上げ becoming
    // available once every koma on the page has finished 線画), pull them into today's
    // mission right away instead of letting them fall into 後日ぶん unseen.
    if (groupId) {
      const groupRows = buildRows(updatedBook).filter((r) => r.groupId === groupId);
      const existingKeys = new Set(nextMissionState.items.map((i) => i.key));
      const newItems = groupRows
        .filter((r) => !existingKeys.has(rowKey(r)))
        .map((r) => ({ key: rowKey(r), hours: rowHours(r), label: r.label, title: rowTitle(r) }));
      if (newItems.length > 0) {
        nextMissionState = { ...nextMissionState, items: [...nextMissionState.items, ...newItems] };
      }
    }

    onUpdateBook({ ...updatedBook, missionState: nextMissionState });
  };

  const completeAtari = (groupId) => {
    burst("atari-" + groupId);
    const fields =
      groupId === "cover"
        ? { cover: { ...book.cover, atariDone: true } }
        : { pages: book.pages.map((p) => (p.id !== groupId ? p : { ...p, atariDone: true })) };
    applyUpdate(fields, `atari-${groupId}`, groupId);
  };

  const completeKoma = (groupId, komaId) => {
    burst(komaId);
    const fields =
      groupId === "cover"
        ? { cover: { ...book.cover, komas: book.cover.komas.map((k) => (k.id === komaId ? { ...k, stage: k.stage + 1 } : k)) } }
        : { pages: book.pages.map((p) => (p.id !== groupId ? p : { ...p, komas: p.komas.map((k) => (k.id === komaId ? { ...k, stage: k.stage + 1 } : k)) })) };
    applyUpdate(fields, `koma-${komaId}`, groupId);
  };

  const onCompleteRow = (row) => (row.type === "atari" ? completeAtari(row.groupId) : completeKoma(row.groupId, row.koma.id));

  /**
   * Reset a koma's stage back to an earlier point (rework / botsu).
   * Permanent action — not tied to the single-step undo snapshot.
   * Only reachable for komas still visible in the list (stage < 3, i.e. not yet finished).
   * Clears any stale doneKeys entry so the row reappears with its new (earlier) task.
   */
  const resetKoma = (row, targetStage) => {
    const { groupId, koma } = row;
    const komaId = koma.id;
    const fields =
      groupId === "cover"
        ? { cover: { ...book.cover, komas: book.cover.komas.map((k) => (k.id === komaId ? { ...k, stage: targetStage } : k)) } }
        : { pages: book.pages.map((p) => (p.id !== groupId ? p : { ...p, komas: p.komas.map((k) => (k.id === komaId ? { ...k, stage: targetStage } : k)) })) };

    const key = `koma-${komaId}`;
    const nextDoneKeys = (mission.doneKeys || []).filter((k) => k !== key);
    const nextMissionState = { ...mission, doneKeys: nextDoneKeys };

    onUpdateBook({ ...book, ...fields, missionState: nextMissionState });
  };

  if (rows.length === 0) {
    return (
      <div className="p-8 text-center" style={{ color: C.inkSoft }}>
        <Sparkles className="mx-auto mb-2" color={C.pink} />
        今日のタスクはありません。完成おめでとう、または次のページ登録を！
      </div>
    );
  }

  return (
    <div className="p-4 space-y-4">
      <div style={{ fontFamily: FONT_DISPLAY, fontSize: 15, color: C.ink }}>🎯 今日のミッション</div>

      {totalCount > 0 && (
        <div>
          <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 4 }}>
            本日 {doneHours.toFixed(1)}h / {totalHours.toFixed(1)}h ・ {doneCount}/{totalCount}個完了
          </div>
          <div style={{ height: 14, border: `2px solid ${C.ink}`, borderRadius: 6, overflow: "hidden", background: "#fff" }}>
            <div style={{ height: "100%", width: `${pct}%`, background: C.mint, transition: "width .4s" }} />
          </div>
        </div>
      )}

      {missionRows.length > 0 ? (
        <RowList rows={missionRows} burstId={burstId} faded={false} onCompleteRow={onCompleteRow} onResetRow={resetKoma} />
      ) : (
        <div className="p-4 text-center rounded-lg" style={{ border: `2px dashed ${C.mint}`, color: C.inkSoft, fontSize: 13 }}>
          🎉 今日のミッション達成！お疲れさま。
        </div>
      )}

      {laterRows.length > 0 && (
        <div>
          <button
            onClick={() => setShowLater((v) => !v)}
            className="flex items-center gap-1 w-full justify-center py-2 rounded-lg"
            style={{ fontFamily: FONT_DISPLAY, fontSize: 12, color: C.inkSoft, border: `2px dashed ${C.inkSoft}`, background: "transparent" }}
          >
            後日ぶん ({laterRows.length}個 ・ {laterHours.toFixed(1)}h) {showLater ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
          </button>
          {showLater && (
            <div className="mt-2">
              <RowList rows={laterRows} burstId={burstId} faded={true} onCompleteRow={onCompleteRow} onResetRow={resetKoma} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ================= Dashboard ================= */
function DashboardView({ book }) {
  const stats = computeStats(book);
  const gs = groups(book).filter((g) => g.komas.length > 0);
  const allKomas = gs.flatMap((g) => g.komas);
  const nonEmptyGroups = gs.length || 1;
  const totalKomas = allKomas.length || 1;

  const atariPct = (gs.filter((g) => g.atariDone).length / nonEmptyGroups) * 100;
  const roughPct = (allKomas.filter((k) => k.stage >= 1).length / totalKomas) * 100;
  const sengaPct = (allKomas.filter((k) => k.stage >= 2).length / totalKomas) * 100;
  const shiagePct = (allKomas.filter((k) => k.stage >= 3).length / totalKomas) * 100;
  const stageDone = [atariPct, roughPct, sengaPct, shiagePct];

  return (
    <div className="p-4 space-y-5">
      {stats.suggestion && (
        <div style={{ border: `2.5px solid ${C.red}`, background: "#FFF0EF", borderRadius: 10, padding: 12, display: "flex", gap: 8 }}>
          <AlertTriangle color={C.red} size={20} style={{ flexShrink: 0, marginTop: 2 }} />
          <div style={{ fontSize: 13, color: C.ink }}>{stats.suggestion}</div>
        </div>
      )}
      <div>
        <div style={{ fontFamily: FONT_DISPLAY, fontSize: 13, color: C.ink, marginBottom: 6 }}>工程別 進捗</div>
        <div className="space-y-2">
          {STAGE_SHORT.map((label, i) => (
            <div key={label}>
              <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 2 }}>{STAGE_LABELS[i]}</div>
              <div style={{ height: 14, border: `2px solid ${C.ink}`, borderRadius: 6, overflow: "hidden", background: "#fff" }}>
                <div style={{ height: "100%", width: `${stageDone[i]}%`, background: C.pink, transition: "width .4s" }} />
              </div>
            </div>
          ))}
        </div>
      </div>
      <div>
        <div className="flex items-center gap-2 mb-1"><DangerDot level={stats.sengaDanger} /><span style={{ fontFamily: FONT_DISPLAY, fontSize: 13, color: C.ink }}>線画ライン(生存)</span></div>
        <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 2 }}>必達 {stats.requiredSenga.toFixed(0)}% ／ 実績 {stats.actualSenga.toFixed(0)}%(時間換算)</div>
        <Bar actual={stats.actualSenga} required={stats.requiredSenga} color={C.mint} />
      </div>
      <div>
        <div className="flex items-center gap-2 mb-1"><DangerDot level={stats.shiageDanger} /><span style={{ fontFamily: FONT_DISPLAY, fontSize: 13, color: C.ink }}>仕上げライン</span></div>
        <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 2 }}>必達 {stats.requiredShiage.toFixed(0)}% ／ 実績 {stats.actualShiage.toFixed(0)}%(時間換算)</div>
        <Bar actual={stats.actualShiage} required={stats.requiredShiage} color={C.pink} />
      </div>
      <div style={{ fontSize: 11, color: C.inkSoft }}>線画目標日: {stats.sengaTargetDate} ／ 締切: {book.deadline}</div>
    </div>
  );
}

/* ================= Book View ================= */
function BookView({ book, onBack, onUpdateBook, onDelete, onEdit }) {
  const [sub, setSub] = useState("today");
  const stats = computeStats(book);
  const daysLeft = daysBetween(todayStr(), book.deadline);
  return (
    <div className="min-h-full" style={{ background: C.paper }}>
      <div className="p-4 pb-2">
        <div className="flex items-center justify-between">
          <button onClick={onBack}><ChevronLeft color={C.ink} /></button>
          <div className="flex items-center gap-3">
            <button onClick={onEdit}><Pencil size={17} color={C.inkSoft} /></button>
            <button onClick={() => window.confirm(`「${book.title}」を削除しますか？`) && onDelete()}><Trash2 size={17} color={C.inkSoft} /></button>
          </div>
        </div>
        <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 6 }}>作品名</div>
        <div className="flex items-center gap-2">
          <DangerDot level={stats.overallDanger} />
          <h2 className="font-display text-lg" style={{ color: C.ink }}>{book.title}</h2>
        </div>
        <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 2 }}>
          総{book.totalPages}ページ ・ 締切 {book.deadline}({daysLeft >= 0 ? `あと${daysLeft}日` : `${-daysLeft}日超過`})
        </div>
        <div className="flex gap-2 mt-3">
          {[["today", "今日のタスク"], ["dashboard", "進捗"]].map(([key, label]) => (
            <button key={key} onClick={() => setSub(key)} className="px-3 py-1.5 rounded-full" style={{ fontFamily: FONT_DISPLAY, fontSize: 12, border: `2px solid ${C.ink}`, background: sub === key ? C.pink : "#fff", color: sub === key ? "#fff" : C.ink }}>
              {label}
            </button>
          ))}
        </div>
      </div>
      {sub === "today" ? <TodayView book={book} onUpdateBook={onUpdateBook} /> : <DashboardView book={book} />}
    </div>
  );
}

/* ================= Tabs / Home ================= */

  const waiting = books.filter((b) => b.startDate > todayStr());
  return (
    <div className="min-h-full p-4" style={{ background: C.paper }}>
      <h1 className="font-display text-2xl mb-1" style={{ color: C.ink }}>コマミッション</h1>
      <p style={{ color: C.inkSoft, fontSize: 13, marginBottom: 16 }}>本を選んで、今日のコマに取り掛かる</p>
      <div className="flex flex-wrap gap-2 mb-6">
        {started.map((b, i) => (
          <button key={b.id} onClick={() => onOpen(b.id)} style={{ fontFamily: FONT_DISPLAY, fontSize: 13, padding: "10px 16px", border: `2.5px solid ${C.ink}`, borderRadius: 10, background: "#fff", boxShadow: `3px 3px 0 ${C.ink}`, transform: `rotate(${i % 2 === 0 ? -1.5 : 1.5}deg)` }}>
            {b.title}
          </button>
        ))}
        <button onClick={onAdd} style={{ fontFamily: FONT_DISPLAY, fontSize: 13, padding: "10px 16px", border: `2.5px dashed ${C.ink}`, borderRadius: 10, background: "transparent", color: C.inkSoft, display: "flex", alignItems: "center", gap: 4 }}>
          <Plus size={14} /> 本を追加
        </button>
      </div>
      {waiting.length > 0 && (
        <div>
          <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 6 }}>待機中(着手前)</div>
          <div className="flex flex-wrap gap-2">
            {waiting.map((b) => (
              <button key={b.id} onClick={() => onOpen(b.id)} style={{ fontFamily: FONT_DISPLAY, fontSize: 12, padding: "8px 14px", border: `2px solid ${C.inkSoft}`, borderRadius: 10, background: "#f2f2f2", color: C.inkSoft }}>
                {b.title} ({b.startDate}〜)
              </button>
            ))}
          </div>
        </div>
      )}
      {books.length === 0 && <div className="mt-10 text-center" style={{ color: C.inkSoft, fontSize: 13 }}>まだ本が登録されていません。「本を追加」から始めよう。</div>}
    </div>
  );
}

/* ================= Error Boundary ================= */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", background: "#FFF0EF", padding: 20, fontFamily: FONT_BODY }}>
          <h2 style={{ fontFamily: FONT_DISPLAY, color: C.red, fontSize: 18, marginBottom: 10 }}>⚠ エラーが発生しました</h2>
          <div style={{ fontSize: 13, color: C.ink, whiteSpace: "pre-wrap", background: "#fff", border: `2px solid ${C.red}`, borderRadius: 8, padding: 10 }}>
            {String(this.state.error && this.state.error.message ? this.state.error.message : this.state.error)}
          </div>
          <button onClick={() => this.setState({ error: null })} style={{ marginTop: 14, padding: "8px 16px", border: `2px solid ${C.ink}`, borderRadius: 8, background: "#fff", fontFamily: FONT_DISPLAY }}>
            戻る
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ================= App ================= */
function AppInner() {
  const [books, setBooks] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("tabs");
  const [selectedId, setSelectedId] = useState(null);

  useEffect(() => {
    (async () => {
      const r = await safeStorage.get("koma-mission-books");
      if (r && r.value) {
        try { setBooks(JSON.parse(r.value)); } catch (e) {}
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    safeStorage.set("koma-mission-books", JSON.stringify(books));
  }, [books, loaded]);

  const selectedBook = books.find((b) => b.id === selectedId);

  return (
    <div style={{ minHeight: "100vh", background: C.paper }}>
      <FontLoader />
      {view === "tabs" && <TabsScreen books={books} onOpen={(id) => { setSelectedId(id); setView("book"); }} onAdd={() => setView("register")} />}
      {view === "register" && <RegisterWizard onCancel={() => setView("tabs")} onSave={(book) => { setBooks((b) => [...b, book]); setView("tabs"); }} />}
      {view === "book" && selectedBook && (
        <BookView
          book={selectedBook}
          onBack={() => setView("tabs")}
          onUpdateBook={(updated) => setBooks((bs) => bs.map((b) => (b.id === updated.id ? updated : b)))}
          onDelete={() => { setBooks((bs) => bs.filter((b) => b.id !== selectedBook.id)); setView("tabs"); }}
          onEdit={() => setView("edit")}
        />
      )}
      {view === "edit" && selectedBook && (
        <EditBookScreen
          book={selectedBook}
          onCancel={() => setView("book")}
          onSave={(updated) => { setBooks((bs) => bs.map((b) => (b.id === updated.id ? updated : b))); setView("book"); }}
        />
      )}
    </div>
  );
}

function App() {
  return (
    <ErrorBoundary>
      <AppInner />
    </ErrorBoundary>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
