  このファイルはこれまで複数回の改修を経ています。以下は現在の最終仕様です
  (過去の変更履歴ではなく、"今こうなっている"という状態の説明です)。

  ■ データ保存
  保存先は localStorage ではなく Firebase(Cloud Firestore)。
  localStorageはiPhoneのホーム画面追加アプリだと予告なくリセットされる
  ことがあり、実際にデータ消失が発生したため切り替えた。Firestore接続に
  失敗した場合のみ、保存の保険としてlocalStorageにフォールバックする。

  Firestoreの保存場所: コレクション "komaMission" / ドキュメント "books"
  中身: { booksJson: "<全本データのJSON文字列>", updatedAt: "<ISO日時>" }

  ⚠ Firestoreは「テストモード」(誰でも読み書き可、30日間限定)で作成した。
  期限が来る前に、Firebaseコンソール → Firestore Database → ルール タブで
  下記に書き換える必要がある(期限なしで同じ内容になる):

    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {
        match /komaMission/{docId} {
          allow read, write: if true;
        }
      }
    }

  ■ 難易度・工程管理
  難易度は低・中・高の3段階(「大ゴマ」という物理サイズの概念は廃止済み)。
  コマの①アタリはページ単位ではなくコマ単位で管理し、同じページ内でも
  コマごとに独立して①→②→③→④と進められる。ただし④仕上げだけは
  「同じページの全コマの③線画が終わっている」ことが条件(仕上げ作業が
  ページ全体に関わるため)。
  表紙は①アタリ〜⑤仕上げの全工程をスライダー式の自己申告%で管理する。
  スライダーは指を離した瞬間(onMouseUp/onTouchEnd)にのみ工程進行を判定する
  (ドラッグ中の連続イベントで一気に複数工程が進んでしまう不具合の修正)。
  コマ・表紙ともに「戻す」ボタンで1工程前(0%から)に戻せる。

  ■ 今日のミッションの組み立て(ADHD特性を踏まえた設計)
  1日の目安時間はあくまで目安。実際には目安の1.5倍まで許容してタスクを
  積む。予算オーバーの単発タスクに当たっても打ち切らず、スキップして
  その先も探し続ける。
  奇数日は低難易度優先、偶数日は中難易度優先。ただし「優先難易度を
  ひたすら消化する」のではなく、①その日の優先難易度を1個だけ露払いに
  使う→②高難易度を必ず1個含める(予算オーバーでも保証)→③残りは
  もう片方の難易度で埋めて、優先難易度は温存する→④それも尽きたら
  優先難易度を追加投入、という順序で組み立てる。これは「低〜中難易度
  ばかり早く消費して後半が高難易度だらけになる」「高難易度を無限に
  回避し続けられる」という2つの悪癖を同時に防ぐための設計。
  なお「3日以上動きのないコマに⚠を表示する」機能はかつて存在したが、
  「今日のミッションに一度も出てきていないのに停滞扱いされる」という
  不公平な誤判定を生むため廃止した。現在この種の警告表示は存在しない。

  ■ ページ番号の考え方
  表紙ウィジェット(表1・表4)とは別に、本文一覧の1番目は「表2」に
  あたる。そのため本文一覧の表示ラベルは配列の並び順+2(P2, P3, P4...)
  で計算している(bodyPageLabel関数)。本文ページは上下ボタンで並び替え
  可能(表3を後方に動かす、等の用途)。

  ■ 実装上の細かい注意点
  ・タスクの識別番号(rowKey)はコマIDだけでなく工程名(atari/rough/senga/
    shiage)も含む。これが無いと工程が進むたびに識別番号が使い回されて
    しまい、「戻す」操作で無関係な完了記録まで巻き添えで消える不具合が
    あった(修正済み)。
  ・「今日」の日付判定はUTCではなく端末のローカル時間基準(todayStr)。
    UTC基準のままだと日本時間の深夜〜朝、日付が変わったのに「まだ昨日」
    と誤判定される不具合があった(修正済み)。
  ・ミッション記録には schemaVersion(MISSION_SCHEMA_VERSION)を持たせて
    あり、識別番号の形式を変えた時は、日付が同じ日でも強制的にその日の
    ミッションを作り直す(形式の不整合で一覧が空に見える問題への対策)。
  ・画面一番下のボタン(保存・後日ぶんなど)は、iPhoneのホームバー操作
    領域と被って押しづらくならないよう、下に安全余白(bottom-safe-spacer)
    を追加してある。

  登録画面のタイトル入力欄の例文(プレースホルダー)は、実際の作品名では
  ない汎用的な表示にしてある。
  データの保存形式が変わった際は、旧データを起動時に自動でマイグレー
  ションする(book.schemaVersion フィールドで判定、済んでいれば何もしない)。
  ===========================================================================
-->

<script type="module">

  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2eW5qoDvLEX2WjjGmGCy_WT6ny6Bpgxo",
    authDomain: "koma-mission.firebaseapp.com",
    projectId: "koma-mission",
    storageBucket: "koma-mission.firebasestorage.app",
    messagingSenderId: "302759536918",
    appId: "1:302759536918:web:9ddd949c53368587b64837",
    measurementId: "G-TSKW1F5VK6"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "komaMission", "books");

    window.firebaseStorage = {
      async load() {
        try {
          const snap = await getDoc(docRef);
          if (snap.exists()) {
            const data = snap.data();
            return data && typeof data.booksJson === "string" ? data.booksJson : null;
          }
          return null;
        } catch (e) {
          console.error("Firestore load error", e);
          throw e;
        }
      },
      async save(booksJson) {
        await setDoc(docRef, { booksJson, updatedAt: new Date().toISOString() });
        return true;
      },
    };
  } catch (e) {
    console.error("Firebase init error", e);
    window.firebaseStorage = null;
  }
</script>

function waitForFirebase(timeoutMs) {
    return new Promise((resolve) => {
        const start = Date.now();
        (function check() {
            if (window.firebaseStorage !== undefined) return resolve(window.firebaseStorage);
            if (Date.now() - start > timeoutMs) return resolve(null);
            setTimeout(check, 50);
        })();
    });
}
function localLoad() {
    try {
        const v = window.localStorage.getItem(LOCAL_KEY);
        return v || null;
    }
    catch (e) {
        return null;
    }
}
function localSave(json) {
    try {
        window.localStorage.setItem(LOCAL_KEY, json);
        return true;
    }
    catch (e) {
        return false;
    }
}
/** Firestoreから読み込み。失敗・未接続ならlocalStorageにフォールバック。
 *  戻り値: { json, source: "firebase"|"local"|"none" } */
async function loadBooksJson() {
    const fs = await waitForFirebase(4000);
    if (fs) {
        try {
            const json = await fs.load();
            if (json)
                return { json, source: "firebase" };
            // Firestoreは空(初回など)。ローカルに何か残っていればそれを使う。
            const local = localLoad();
            return { json: local, source: local ? "local" : "none" };
        }
        catch (e) {
            const local = localLoad();
            return { json: local, source: local ? "local" : "none" };
        }
    }
    const local = localLoad();
    return { json: local, source: local ? "local" : "none" };
}

    const fs = await waitForFirebase(2000);
    if (fs) {
        try {
            await fs.save(json);
            localSave(json); // 保険として常にローカルにも残す
            return "firebase";
        }
        catch (e) {
            return localSave(json) ? "local" : "error";
        }
    }
    return localSave(json) ? "local" : "error";
